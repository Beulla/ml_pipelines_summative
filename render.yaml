# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: dyslexia-screening-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AUTO_RETRAIN
        value: "false"
      - key: RETRAIN_MIN_NEW_SAMPLES
        value: "20"
      - key: BATCH_SIZE
        value: "8"
      - key: EVAL_BATCH_SIZE
        value: "16"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"

  - type: web
    name: dyslexia-screening-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.ui
    envVars:
      - key: API_URL
        sync: false   